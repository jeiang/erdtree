name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# PRs: a new push cancels the superseded run. Pushes to master: one group per commit, so every
# merged commit gets a complete run (a shared group would cancel pending runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install # version from rust-toolchain.toml
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # PRs restore master's cache; saving per PR cost 13-20 s per job on macOS and Windows.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo test --locked

  # Release targets that no other job builds. Checking needs no linker or SDK.
  cross:
    name: clippy (cross targets)
    runs-on: ubuntu-latest
    env:
      TARGETS: >-
        aarch64-unknown-linux-gnu aarch64-unknown-linux-musl x86_64-unknown-linux-musl
        x86_64-apple-darwin i686-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup toolchain install
          # shellcheck disable=SC2086 # TARGETS is split on purpose
          rustup target add $TARGETS
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: for t in $TARGETS; do cargo clippy --all-targets --locked --target "$t" -- -D warnings || exit 1; done

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    env:
      # Keep in sync with `rust-version` in Cargo.toml; overrides rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo check --all-targets --locked

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Single required status check for branch protection.
  ci-pass:
    name: ci-pass
    if: always()
    needs: [fmt, clippy, cross, test, msrv, deny]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      # needs.*.result is not enough: in run 41870832578 both macOS matrix legs were cancelled
      # without a runner and ci-pass still passed. Check the latest attempt of every job instead.
      - env:
          GH_TOKEN: ${{ github.token }}
          JOBS: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs
          FILTER: '.jobs[] | select(.name != "ci-pass" and .conclusion != "success") | "\(.name): \(.conclusion)"'
        run: |
          bad=$(gh api --paginate "$JOBS" --jq "$FILTER")
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
          echo "every job succeeded"
