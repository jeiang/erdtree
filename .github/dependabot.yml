version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Generated by `dist generate`; edits make `dist plan` fail. Bump `cargo-dist-version` instead.
    exclude-paths:
      - .github/workflows/release.yml
