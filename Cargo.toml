[package]
name = "erdtree"
version = "4.0.0"
edition = "2024"
authors = ["Benjamin Nguyen <benjamin.van.nguyen@gmail.com>"]
description = """
erdtree (erd) is a cross-platform, multi-threaded, and general purpose
filesystem and disk usage utility that is aware of .gitignore and hidden file rules.
"""
categories = ["command-line-utilities"]
documentation = "https://github.com/jeiang/erdtree"
homepage = "https://github.com/jeiang/erdtree"
repository = "https://github.com/jeiang/erdtree"
keywords = ["tree", "find", "ls", "du", "commandline"]
exclude = ["assets/*", "scripts/*", "example/*"]
readme = "README.md"
license = "MIT"
rust-version = "1.88"
build = "src/build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "erd"
path = "src/main.rs"

[dependencies]
# `clock` (chrono's `Local`) links CoreFoundation through `iana-time-zone` on macOS, where
# `src/render/long/zone.rs` stands in for it.
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
config = { version = "0.15.27", default-features = false, features = ["toml"] }
crossterm = "0.29.0"
ctrlc = "3.5.2"
dirs = "7.0.0"
errno = "0.3.14"
filesize = "0.2.0"
ignore = "0.4.33"

lscolors = { version = "0.21.0", default-features = false, features = ["nu-ansi-term"] }
nu-ansi-term = "0.50.3"
regex = "1.13.1"
same-file = "1.0.6"
terminal_size = "0.4.4"
thiserror = "2.0.21"

[target.'cfg(not(target_os = "macos"))'.dependencies]
chrono = "0.4.45"

[target.'cfg(target_os = "macos")'.dependencies]
tz-rs = "0.7.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
indoc = "2.0.8"
strip-ansi-escapes = "0.2.1"
tempfile = "3.27.0"

# Tests compare `src/render/long/zone.rs` with chrono's `Local`.
[target.'cfg(target_os = "macos")'.dev-dependencies]
chrono = { version = "0.4.45", features = ["clock"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[lints.rust]
# Kani proof harnesses (`cargo kani`) are compiled only under `cfg(kani)`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
